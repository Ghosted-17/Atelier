<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Atelier Stylized 3D Digital Avatar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #studio-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: #FAFAFA;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #D4AF37;
      box-shadow: 0 0 6px #D4AF37;
    }
    body.light-mode {
      background-color: #FAFAFA !important;
    }
    body.light-mode .badge {
      background: rgba(17, 17, 17, 0.06);
      color: #111111;
      border-color: rgba(212, 175, 55, 0.35);
    }
    #touch-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(200, 200, 200, 0.5);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
    body.light-mode #touch-hint {
      color: rgba(120, 120, 120, 0.7);
    }
  </style>
  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container">
    <div id="studio-overlay">
      <div class="badge" id="model-badge">
        <span class="badge-dot"></span>
        <span id="model-label">MALE • SLIM</span>
      </div>
    </div>
    <div id="touch-hint">
      <span>⟵ Drag to rotate 360° ⟶</span>
    </div>
  </div>

  <script>
    // ==========================================
    // ATELIER BITMOJI 3D ENGINE STATE
    // ==========================================
    const state = {
      gender: 'male',
      bodyType: 'slim',
      rotation: 0,
      isDark: true,
      skinTone: '#EEDBC8',
      colors: {
        top: '#111111',
        bottom: '#1B263B',
        shoes: '#F5F5F0',
        headwear: '#111111',
        accessories: '#D4AF37'
      },
      activeGarments: {
        headwear: 'cap_baseball',
        top: 'hoodie_oversized',
        bottom: 'jeans_baggy',
        footwear: 'sneakers_chunky',
        accessories: 'chain_gold'
      }
    };

    let activeEngine = 'none';
    let isDragging = false;
    let previousTouchX = 0;
    let touchVelocity = 0;

    let scene, camera, webglRenderer, avatarGroup, stageGroup;
    let keyRimLight, fillRimLight, keyFrontLight, ambientLight;
    const materials = {};
    const garmentRegistry = {
      headwear: {},
      top: {},
      bottom: {},
      footwear: {},
      accessories: {}
    };

    // ==========================================
    // INITIALIZATION & FALLBACK HANDLING
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      const success = tryInitWebGL(container);
      if (success) {
        activeEngine = 'webgl';
      } else {
        initCanvas2D(container);
        activeEngine = 'canvas2d';
      }
    }

    function tryInitWebGL(container) {
      if (typeof THREE === 'undefined') return false;

      try {
        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || window.innerHeight;

        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl', { failIfMajorPerformanceCaveat: false, powerPreference: "default" }) ||
                   canvas.getContext('experimental-webgl', { failIfMajorPerformanceCaveat: false });
        if (!gl) return false;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(state.isDark ? 0x111111 : 0xFAFAFA);

        camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
        camera.position.set(0, 1.25, 4.2);
        camera.lookAt(0, 0.9, 0);

        webglRenderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          alpha: true,
          powerPreference: "default",
          failIfMajorPerformanceCaveat: false
        });
        webglRenderer.setSize(width, height);
        webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        webglRenderer.shadowMap.enabled = true;
        webglRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(webglRenderer.domElement);

        setupWebGLLighting();
        buildWebGLStage();
        buildBitmojiAvatar();

        bindPointerEvents(webglRenderer.domElement);
        animate();
        return true;
      } catch (err) {
        console.warn("WebGL init failed, falling back to Canvas2D:", err);
        return false;
      }
    }

    // ==========================================
    // TWO-TONE RIM LIGHTING & MATTE STUDIO
    // ==========================================
    function setupWebGLLighting() {
      ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.55);
      scene.add(ambientLight);

      // Key Front Soft Light
      keyFrontLight = new THREE.DirectionalLight(0xFFF9E6, 0.75);
      keyFrontLight.position.set(1.5, 3.0, 3.0);
      keyFrontLight.castShadow = true;
      keyFrontLight.shadow.mapSize.width = 1024;
      keyFrontLight.shadow.mapSize.height = 1024;
      keyFrontLight.shadow.camera.near = 0.5;
      keyFrontLight.shadow.camera.far = 10;
      scene.add(keyFrontLight);

      // Cool Secondary Fill
      const fillLight = new THREE.DirectionalLight(0xE0F7FA, 0.35);
      fillLight.position.set(-2.0, 1.8, 2.5);
      scene.add(fillLight);

      // Two-Tone Stylized Rim Lights
      // 1. Warm Golden Rim Light (Right-Rear)
      keyRimLight = new THREE.DirectionalLight(0xD4AF37, 1.25);
      keyRimLight.position.set(2.4, 2.6, -2.6);
      scene.add(keyRimLight);

      // 2. Cool Cyan/Ice Rim Light (Left-Rear)
      fillRimLight = new THREE.DirectionalLight(0x64B5F6, 0.95);
      fillRimLight.position.set(-2.4, 2.0, -2.6);
      scene.add(fillRimLight);
    }

    function buildWebGLStage() {
      stageGroup = new THREE.Group();

      // Circular Runway Pedestal Podium
      const pedestalGeo = new THREE.CylinderGeometry(0.88, 0.94, 0.07, 48);
      const pedestalMat = new THREE.MeshStandardMaterial({
        color: state.isDark ? 0x1A1A1A : 0xFFFFFF,
        roughness: 0.35,
        metalness: 0.08
      });
      const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
      pedestal.position.y = 0.035;
      pedestal.receiveShadow = true;
      stageGroup.add(pedestal);

      // Matte Gold Runway Rim Trim
      const rimGeo = new THREE.TorusGeometry(0.91, 0.012, 16, 48);
      rimGeo.rotateX(Math.PI / 2);
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xD4AF37,
        roughness: 0.25,
        metalness: 0.85
      });
      const rim = new THREE.Mesh(rimGeo, goldMat);
      rim.position.y = 0.07;
      stageGroup.add(rim);

      // Soft contact shadow directly under avatar feet
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 128;
      shadowCanvas.height = 128;
      const sCtx = shadowCanvas.getContext('2d');
      const grad = sCtx.createRadialGradient(64, 64, 4, 64, 64, 60);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.25)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, 128, 128);

      const shadowTex = new THREE.CanvasTexture(shadowCanvas);
      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.85, 0.85),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: 0.7 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = 0.072;
      stageGroup.add(shadowPlane);

      materials.stage = pedestalMat;
      materials.gold = goldMat;
      scene.add(stageGroup);
    }

    // ==========================================
    // STYLIZED BITMOJI AVATAR & MODULAR GARMENTS
    // ==========================================
    function buildBitmojiAvatar() {
      if (avatarGroup) scene.remove(avatarGroup);
      avatarGroup = new THREE.Group();

      // Cel-Shaded / Matte Materials (Smooth PBR with tuned matte finish)
      materials.skin = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.skinTone),
        roughness: 0.42,
        metalness: 0.02
      });
      materials.headwear = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.colors.headwear),
        roughness: 0.48,
        metalness: 0.05
      });
      materials.top = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.colors.top),
        roughness: 0.52,
        metalness: 0.04
      });
      materials.bottom = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.colors.bottom),
        roughness: 0.50,
        metalness: 0.04
      });
      materials.shoes = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.colors.shoes),
        roughness: 0.40,
        metalness: 0.06
      });
      materials.accessories = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.colors.accessories),
        roughness: 0.28,
        metalness: 0.85
      });
      materials.hair = new THREE.MeshStandardMaterial({
        color: 0x221814,
        roughness: 0.65,
        metalness: 0.02
      });
      materials.eyeWhite = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
      materials.eyePupil = new THREE.MeshBasicMaterial({ color: 0x1A1412 });
      materials.boxer = new THREE.MeshStandardMaterial({
        color: 0x18181C,
        roughness: 0.55,
        metalness: 0.03
      });

      const isFemale = state.gender === 'female';
      const bType = state.bodyType;
      const wMult = (bType === 'athletic') ? 1.06 :
                    (bType === 'broad') ? 1.18 :
                    (bType === 'curvy') ? 1.12 : 0.92;

      // 1. STYLIZED HEAD & EXPRESSIVE FACE (Snap Bitmoji Proportions)
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.86, 0);

      // Stylized Smooth Cranium
      const craniumGeo = new THREE.SphereGeometry(0.125, 32, 32);
      craniumGeo.scale(0.92, 1.15, 0.98);
      const headMesh = new THREE.Mesh(craniumGeo, materials.skin);
      headMesh.castShadow = true;
      headGroup.add(headMesh);

      // Defined Stylized Jaw & Chin
      const chinGeo = new THREE.SphereGeometry(0.048, 24, 24);
      chinGeo.scale(0.85, 0.88, 1.15);
      const chin = new THREE.Mesh(chinGeo, materials.skin);
      chin.position.set(0, -0.078, 0.045);
      headGroup.add(chin);

      // Expressive Stylized Eyes
      [-1, 1].forEach(side => {
        const eyeGroup = new THREE.Group();
        eyeGroup.position.set(side * 0.046, -0.015, 0.108);

        // White Sclera
        const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.018, 16, 16), materials.eyeWhite);
        sclera.scale.set(1.15, 0.90, 0.45);
        eyeGroup.add(sclera);

        // Dark Iris/Pupil
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.010, 16, 16), materials.eyePupil);
        pupil.scale.set(1.0, 1.0, 0.35);
        pupil.position.set(0, 0, 0.007);
        eyeGroup.add(pupil);

        // Specular Catchlight Sparkle
        const sparkle = new THREE.Mesh(new THREE.SphereGeometry(0.003, 8, 8), materials.eyeWhite);
        sparkle.position.set(0.003, 0.003, 0.010);
        eyeGroup.add(sparkle);

        // Stylized Eyebrow
        const brow = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.006, 0.008), materials.hair);
        brow.position.set(0, 0.024, 0.005);
        brow.rotation.z = side * -0.08;
        eyeGroup.add(brow);

        headGroup.add(eyeGroup);
      });

      // Stylized Button Nose
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.014, 16, 16), materials.skin);
      nose.scale.set(0.85, 0.95, 1.25);
      nose.position.set(0, -0.042, 0.124);
      headGroup.add(nose);

      // Expressive Mouth (Confident Stylized Smile)
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.020, 0.004, 12, 18, Math.PI * 0.8), materials.hair);
      mouth.position.set(0, -0.075, 0.112);
      mouth.rotation.x = 0.2;
      mouth.rotation.z = Math.PI * 1.1;
      headGroup.add(mouth);

      // Stylized Ears
      [-1, 1].forEach(side => {
        const ear = new THREE.Mesh(new THREE.SphereGeometry(0.028, 16, 16), materials.skin);
        ear.scale.set(0.35, 1.15, 0.80);
        ear.position.set(side * 0.115, -0.02, 0);
        ear.rotation.y = side * 0.25;
        headGroup.add(ear);
      });

      // Stylized Haircut Base
      const hairGroup = new THREE.Group();
      hairGroup.name = "hair_base";
      const hairCrown = new THREE.Mesh(new THREE.SphereGeometry(0.130, 28, 28), materials.hair);
      hairCrown.scale.set(0.96, 1.16, 0.98);
      hairCrown.position.set(0, 0.02, -0.01);
      hairGroup.add(hairCrown);

      const hairFade = new THREE.Mesh(new THREE.CylinderGeometry(0.124, 0.118, 0.09, 28), materials.hair);
      hairFade.position.set(0, 0.02, -0.015);
      hairGroup.add(hairFade);
      headGroup.add(hairGroup);

      // 2. MODULAR HEADWEAR GARMENTS
      const headwearMount = new THREE.Group();
      headwearMount.name = "headwear_mount";

      // Cap (Baseball / Snapback)
      const capMesh = new THREE.Group();
      capMesh.name = "cap_baseball";
      const capCrown = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 24, 0, Math.PI * 2, 0, Math.PI * 0.55), materials.headwear);
      capCrown.position.set(0, 0.02, 0);
      capMesh.add(capCrown);
      const capVisor = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.012, 0.11), materials.headwear);
      capVisor.position.set(0, 0.035, 0.13);
      capVisor.rotation.x = 0.08;
      capMesh.add(capVisor);
      const capButton = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 12), materials.accessories);
      capButton.position.set(0, 0.155, 0);
      capMesh.add(capButton);
      headwearMount.add(capMesh);
      garmentRegistry.headwear['cap_baseball'] = capMesh;

      // Knit Beanie
      const beanieMesh = new THREE.Group();
      beanieMesh.name = "beanie_knit";
      const beanieBody = new THREE.Mesh(new THREE.CylinderGeometry(0.138, 0.132, 0.14, 28), materials.headwear);
      beanieBody.position.set(0, 0.06, 0);
      beanieMesh.add(beanieBody);
      const beanieDome = new THREE.Mesh(new THREE.SphereGeometry(0.138, 24, 24, 0, Math.PI * 2, 0, Math.PI * 0.5), materials.headwear);
      beanieDome.position.set(0, 0.13, 0);
      beanieMesh.add(beanieDome);
      headwearMount.add(beanieMesh);
      garmentRegistry.headwear['beanie_knit'] = beanieMesh;

      // Wool Fedora
      const fedoraMesh = new THREE.Group();
      fedoraMesh.name = "fedora_felt";
      const fedoraCrown = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.130, 0.10, 24), materials.headwear);
      fedoraCrown.position.set(0, 0.08, 0);
      fedoraMesh.add(fedoraCrown);
      const fedoraBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.012, 28), materials.headwear);
      fedoraBrim.position.set(0, 0.035, 0);
      fedoraMesh.add(fedoraBrim);
      headwearMount.add(fedoraMesh);
      garmentRegistry.headwear['fedora_felt'] = fedoraMesh;

      // Leather Beret
      const beretMesh = new THREE.Group();
      beretMesh.name = "beret_leather";
      const beretDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.13, 0.045, 28), materials.headwear);
      beretDisc.position.set(0.02, 0.08, 0);
      beretDisc.rotation.z = -0.15;
      beretMesh.add(beretDisc);
      headwearMount.add(beretMesh);
      garmentRegistry.headwear['beret_leather'] = beretMesh;

      const noneHead = new THREE.Group();
      noneHead.name = "none";
      headwearMount.add(noneHead);
      garmentRegistry.headwear['none'] = noneHead;

      headGroup.add(headwearMount);
      avatarGroup.add(headGroup);

      // 3. TORSO & ANATOMICAL CORE (Cel-Shaded Stylized Proportions)
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(0, 1.42, 0);

      // Stylized Neck
      const neckGeo = new THREE.CylinderGeometry(0.052 * wMult, 0.062 * wMult, 0.14, 24);
      const neck = new THREE.Mesh(neckGeo, materials.skin);
      neck.position.set(0, 0.35, 0);
      torsoGroup.add(neck);

      // Stylized Chest & Ribcage
      const chestGeo = new THREE.CylinderGeometry(0.170 * wMult, 0.145 * wMult, 0.32, 28);
      chestGeo.scale(1.0, 1.0, 0.72);
      const chest = new THREE.Mesh(chestGeo, materials.skin);
      chest.position.set(0, 0.16, 0);
      chest.castShadow = true;
      torsoGroup.add(chest);

      // Stylized Waist & Abdomen
      const waistGeo = new THREE.CylinderGeometry(0.145 * wMult, 0.155 * wMult, 0.24, 28);
      waistGeo.scale(1.0, 1.0, 0.72);
      const waist = new THREE.Mesh(waistGeo, materials.skin);
      waist.position.set(0, -0.10, 0);
      torsoGroup.add(waist);

      // 4. MODULAR SNAP-ON TOPS
      const topMount = new THREE.Group();
      topMount.name = "top_mount";

      // A) Oversized Street Hoodie
      const hoodieMesh = new THREE.Group();
      hoodieMesh.name = "hoodie_oversized";
      const hoodieTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.190 * wMult, 0.175 * wMult, 0.52, 28), materials.top);
      hoodieTorso.scale.set(1.04, 1.0, 0.82);
      hoodieTorso.position.set(0, 0.08, 0);
      hoodieMesh.add(hoodieTorso);
      // Front Kangaroo Pouch Pocket
      const pocket = new THREE.Mesh(new THREE.BoxGeometry(0.16 * wMult, 0.10, 0.03), materials.top);
      pocket.position.set(0, -0.06, 0.13 * wMult);
      hoodieMesh.add(pocket);
      // Back Hood
      const hoodBack = new THREE.Mesh(new THREE.SphereGeometry(0.12 * wMult, 18, 18), materials.top);
      hoodBack.scale.set(0.9, 1.2, 0.7);
      hoodBack.position.set(0, 0.24, -0.10);
      hoodieMesh.add(hoodBack);
      topMount.add(hoodieMesh);
      garmentRegistry.top['hoodie_oversized'] = hoodieMesh;

      // B) Tailored Wool Blazer
      const blazerMesh = new THREE.Group();
      blazerMesh.name = "blazer_tailored";
      const blazerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.185 * wMult, 0.165 * wMult, 0.54, 28), materials.top);
      blazerBody.scale.set(1.02, 1.0, 0.80);
      blazerBody.position.set(0, 0.06, 0);
      blazerMesh.add(blazerBody);
      // Notched Lapels
      [-1, 1].forEach(side => {
        const lapel = new THREE.Mesh(new THREE.BoxGeometry(0.06 * wMult, 0.22, 0.02), materials.top);
        lapel.position.set(side * 0.08 * wMult, 0.14, 0.12 * wMult);
        lapel.rotation.z = side * -0.15;
        blazerMesh.add(lapel);
      });
      topMount.add(blazerMesh);
      garmentRegistry.top['blazer_tailored'] = blazerMesh;

      // C) Boxy Minimalist Tee
      const teeMesh = new THREE.Group();
      teeMesh.name = "tee_boxy";
      const teeBody = new THREE.Mesh(new THREE.CylinderGeometry(0.178 * wMult, 0.162 * wMult, 0.46, 28), materials.top);
      teeBody.scale.set(1.0, 1.0, 0.76);
      teeBody.position.set(0, 0.08, 0);
      teeMesh.add(teeBody);
      topMount.add(teeMesh);
      garmentRegistry.top['tee_boxy'] = teeMesh;

      // D) Varsity Bomber Jacket
      const varsityMesh = new THREE.Group();
      varsityMesh.name = "jacket_varsity";
      const varsityBody = new THREE.Mesh(new THREE.CylinderGeometry(0.188 * wMult, 0.165 * wMult, 0.48, 28), materials.top);
      varsityBody.scale.set(1.05, 1.0, 0.82);
      varsityBody.position.set(0, 0.07, 0);
      varsityMesh.add(varsityBody);
      topMount.add(varsityMesh);
      garmentRegistry.top['jacket_varsity'] = varsityMesh;

      // E) Polo Knit
      const poloMesh = new THREE.Group();
      poloMesh.name = "polo_knit";
      const poloBody = new THREE.Mesh(new THREE.CylinderGeometry(0.174 * wMult, 0.158 * wMult, 0.45, 28), materials.top);
      poloBody.scale.set(1.0, 1.0, 0.76);
      poloBody.position.set(0, 0.08, 0);
      poloMesh.add(poloBody);
      topMount.add(poloMesh);
      garmentRegistry.top['polo_knit'] = poloMesh;

      // F) Ribbed Athletic Tank
      const tankMesh = new THREE.Group();
      tankMesh.name = "tank_ribbed";
      const tankBody = new THREE.Mesh(new THREE.CylinderGeometry(0.170 * wMult, 0.150 * wMult, 0.42, 28), materials.top);
      tankBody.scale.set(0.98, 1.0, 0.74);
      tankBody.position.set(0, 0.08, 0);
      tankMesh.add(tankBody);
      topMount.add(tankMesh);
      garmentRegistry.top['tank_ribbed'] = tankMesh;

      torsoGroup.add(topMount);

      // 5. STYLIZED MODULAR ARMS & SLEEVES
      [-1, 1].forEach(side => {
        const armGroup = new THREE.Group();
        armGroup.position.set(side * 0.22 * wMult, 0.24, 0);

        // Rounded Stylized Deltoid Shoulder
        const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.065 * wMult, 20, 20), materials.skin);
        shoulder.position.set(0, 0, 0);
        armGroup.add(shoulder);

        // Upper Arm
        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.048 * wMult, 0.042 * wMult, 0.28, 24), materials.skin);
        upperArm.position.set(0, -0.15, 0);
        upperArm.rotation.z = side * -0.08;
        armGroup.add(upperArm);

      // Bare Legs Anatomy (Visible under shorts/boxers or for footwear mounting)

        // 7. MODULAR FOOTWEAR

        loaferSole.position.set(0, 0.02, 0.02);

        // Chelsea Boots
        const boots = new THREE.Group();

        if (!garmentRegistry.footwear['boots_chelsea']) garmentRegistry.footwear['boots_chelsea'] = [];
        garmentRegistry.footwear['boots_chelsea'].push(boots);

        // Derby Shoes
        const derbies = new THREE.Group();
        derbies.name = "derby_shoes";
        const derbyFoot = new THREE.Mesh(new THREE.BoxGeometry(0.074 * wMult, 0.034, 0.175), materials.shoes);

        // Bare Sculpted Feet
        const bareFeet = new THREE.Group();
        bareFeet.name = "bare_feet";
        const footInstep = new THREE.Mesh(new THREE.SphereGeometry(0.038 * wMult, 18, 18), materials.skin);
        footInstep.scale.set(0.85, 0.65, 1.45);
        footInstep.position.set(0, 0.02, 0.015);
        bareFeet.add(footInstep);
        footMount.add(bareFeet);
        if (!garmentRegistry.footwear['bare_feet']) garmentRegistry.footwear['bare_feet'] = [];
        garmentRegistry.footwear['bare_feet'].push(bareFeet);

        legGroup.add(footMount);
        lowerBodyGroup.add(legGroup);
      });

      avatarGroup.add(lowerBodyGroup);

      // 8. ACCESSORIES (Chain, Crossbody, Glasses)
      const accMount = new THREE.Group();
      accMount.name = "acc_mount";

      // 24K Gold Cuban Chain
      const chainMesh = new THREE.Mesh(new THREE.TorusGeometry(0.082 * wMult, 0.008, 12, 28), materials.accessories);
      chainMesh.name = "chain_gold";
      chainMesh.position.set(0, 1.76, 0.04);
      chainMesh.rotation.x = Math.PI * 0.40;

      // Crossbody Leather Pouch
      const bagMesh = new THREE.Group();

      pouch.position.set(0.10 * wMult, 1.34, 0.14 * wMult);
      pouch.rotation.z = -0.15;
      bagMesh.add(pouch);
      const strap = new THREE.Mesh(new THREE.TorusGeometry(0.24 * wMult, 0.006, 8, 28), materials.accessories);
      strap.position.set(0, 1.55, 0);
      strap.rotation.x = Math.PI * 0.45;
      strap.rotation.y = 0.35;
      bagMesh.add(strap);

      // Acetate Fashion Shades
      const shadesMesh = new THREE.Group();
      shadesMesh.name = "glasses_shades";

      glassesBar.position.set(0, 1.84, 0.125);

      avatarGroup.add(accMount);

      // Apply initial active garments visibility
      applyGarmentVisibility();

      scene.add(avatarGroup);
    }

    function applyGarmentVisibility() {
      // Top
      Object.keys(garmentRegistry.top).forEach(name => {
        const obj = garmentRegistry.top[name];
        if (obj) obj.visible = (name === state.activeGarments.top);
      });

      // Bottom
      Object.keys(garmentRegistry.bottom).forEach(name => {
        const obj = garmentRegistry.bottom[name];
        if (obj) obj.visible = (name === state.activeGarments.bottom);
      });

      // Headwear
      Object.keys(garmentRegistry.headwear).forEach(name => {
        const obj = garmentRegistry.headwear[name];
        if (obj) obj.visible = (name === state.activeGarments.headwear);
      });

      // Footwear
      Object.keys(garmentRegistry.footwear).forEach(name => {
        const list = garmentRegistry.footwear[name];
        if (Array.isArray(list)) {
          list.forEach(item => item.visible = (name === state.activeGarments.footwear));
        }
      });

      // Accessories
      Object.keys(garmentRegistry.accessories).forEach(name => {
        const obj = garmentRegistry.accessories[name];
        if (obj) obj.visible = (name === state.activeGarments.accessories);
      });
    }

    // ==========================================
    // TURNTABLE ROTATION & TOUCH GESTURES
    // ==========================================
    function bindPointerEvents(element) {
      element.addEventListener('pointerdown', (e) => {
        isDragging = true;
        previousTouchX = e.clientX;
        touchVelocity = 0;
        const hint = document.getElementById('touch-hint');
        if (hint) hint.style.opacity = '0';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousTouchX;
        previousTouchX = e.clientX;
        touchVelocity = deltaX * 0.008;
        state.rotation += touchVelocity;
        if (avatarGroup) avatarGroup.rotation.y = state.rotation;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });
    }

    function animate() {
      requestAnimationFrame(animate);

      // Inertia damping
      if (!isDragging && Math.abs(touchVelocity) > 0.0001) {
        touchVelocity *= 0.92;
        state.rotation += touchVelocity;
        if (avatarGroup) avatarGroup.rotation.y = state.rotation;
      }

      if (webglRenderer && scene && camera) {
        webglRenderer.render(scene, camera);
      }
    }

    // ==========================================
    // EXPOSED JAVASCRIPT HOOKS (Called from Kotlin)
    // ==========================================
    window.setGender = function(gender) {
      if (!gender) return;
      state.gender = gender.toLowerCase();
      updateModelBadge();
      if (activeEngine === 'webgl') buildBitmojiAvatar();
      else renderCanvas2D();
    };

    window.setBodyType = function(type) {
      if (!type) return;
      state.bodyType = type.toLowerCase();
      updateModelBadge();
      if (activeEngine === 'webgl') buildBitmojiAvatar();
      else renderCanvas2D();
    };

    window.setGarment = function(category, meshName) {
      if (!category || !meshName) return;
      state.activeGarments[category.toLowerCase()] = meshName.toLowerCase();
      if (activeEngine === 'webgl') {
        applyGarmentVisibility();
      } else {
        renderCanvas2D();
      }
    };

    window.setGarmentColor = function(category, hex) {
      if (!category || !hex) return;
      const cat = category.toLowerCase();
      state.colors[cat] = hex;
      if (activeEngine === 'webgl') {
        if (materials[cat]) materials[cat].color.set(hex);
      } else {
        renderCanvas2D();
      }
    };

    window.setRotation = function(degrees) {
      state.rotation = (degrees * Math.PI) / 180;
      if (avatarGroup) avatarGroup.rotation.y = state.rotation;
      if (activeEngine === 'canvas2d') renderCanvas2D();
    };

    window.setSkinTone = function(hex) {
      if (!hex) return;
      state.skinTone = hex;
      if (activeEngine === 'webgl') {
        if (materials.skin) materials.skin.color.set(hex);
      } else {
        renderCanvas2D();
      }
    };

    window.setTheme = function(isDark) {
      state.isDark = isDark;
      if (isDark) {
        document.body.classList.remove('light-mode');
        if (scene) scene.background = new THREE.Color(0x111111);
        if (materials.stage) materials.stage.color.set(0x1A1A1A);
      } else {
        document.body.classList.add('light-mode');
        if (scene) scene.background = new THREE.Color(0xFAFAFA);
        if (materials.stage) materials.stage.color.set(0xFFFFFF);
      }
      if (activeEngine === 'canvas2d') renderCanvas2D();
    };

    window.updateColors = function(topHex, bottomHex, shoesHex, headwearHex, accHex, skinHex) {
      if (topHex) state.colors.top = topHex;
      if (bottomHex) state.colors.bottom = bottomHex;
      if (shoesHex) state.colors.shoes = shoesHex;
      if (headwearHex) state.colors.headwear = headwearHex;
      if (accHex) state.colors.accessories = accHex;
      if (skinHex) state.skinTone = skinHex;

      if (activeEngine === 'webgl') {
        if (materials.top && topHex) materials.top.color.set(topHex);
        if (materials.bottom && bottomHex) materials.bottom.color.set(bottomHex);
        if (materials.shoes && shoesHex) materials.shoes.color.set(shoesHex);
        if (materials.headwear && headwearHex) materials.headwear.color.set(headwearHex);
        if (materials.accessories && accHex) materials.accessories.color.set(accHex);
        if (materials.skin && skinHex) materials.skin.color.set(skinHex);
      } else {
        renderCanvas2D();
      }
    };

    window.loadModel = function(gender, bodyType) {
      if (gender) state.gender = gender.toLowerCase();
      if (bodyType) state.bodyType = bodyType.toLowerCase();
      updateModelBadge();
      if (activeEngine === 'webgl') buildBitmojiAvatar();
      else renderCanvas2D();
    };

    function updateModelBadge() {
      const label = document.getElementById('model-label');
      if (label) {
        label.innerText = `${state.gender.toUpperCase()} • ${state.bodyType.toUpperCase()}`;
      }
    }

    // ==========================================
    // CANVAS 2D FALLBACK ENGINE
    // ==========================================
    let canvas2d, ctx2d;
    function initCanvas2D(container) {
      canvas2d = document.createElement('canvas');
      canvas2d.width = container.clientWidth || 360;
      canvas2d.height = container.clientHeight || 540;
      container.appendChild(canvas2d);
      ctx2d = canvas2d.getContext('2d');
      bindPointerEvents(canvas2d);
      renderCanvas2D();
    }

    function renderCanvas2D() {
      if (!ctx2d || !canvas2d) return;
      const w = canvas2d.width;
      const h = canvas2d.height;
      ctx2d.clearRect(0, 0, w, h);

      // Background
      ctx2d.fillStyle = state.isDark ? '#111111' : '#FAFAFA';
      ctx2d.fillRect(0, 0, w, h);

      const cx = w * 0.5;
      const baseY = h * 0.88;

      // Stylized Podium
      ctx2d.fillStyle = state.isDark ? '#1A1A1A' : '#FFFFFF';
      ctx2d.beginPath();
      ctx2d.ellipse(cx, baseY, 120, 22, 0, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.strokeStyle = '#D4AF37';
      ctx2d.lineWidth = 2;
      ctx2d.stroke();

      // Stylized Legs
      ctx2d.fillStyle = (state.activeGarments.bottom === 'shorts_boxer') ? state.skinTone : state.colors.bottom;
      ctx2d.fillRect(cx - 36, baseY - 180, 28, 160);
      ctx2d.fillRect(cx + 8, baseY - 180, 28, 160);

      // Footwear
      ctx2d.fillStyle = state.colors.shoes;
      ctx2d.beginPath();
      ctx2d.ellipse(cx - 22, baseY - 10, 20, 10, 0, 0, Math.PI * 2);
      ctx2d.ellipse(cx + 22, baseY - 10, 20, 10, 0, 0, Math.PI * 2);
      ctx2d.fill();

      // Torso / Top Garment
      ctx2d.fillStyle = state.colors.top;
      ctx2d.fillRect(cx - 48, baseY - 310, 96, 140);

      // Neck & Head
      ctx2d.fillStyle = state.skinTone;
      ctx2d.fillRect(cx - 14, baseY - 340, 28, 35);
      ctx2d.beginPath();
      ctx2d.ellipse(cx, baseY - 380, 38, 48, 0, 0, Math.PI * 2);
      ctx2d.fill();

      // Expressive Stylized Eyes
      ctx2d.fillStyle = '#FFFFFF';
      ctx2d.beginPath();
      ctx2d.ellipse(cx - 14, baseY - 385, 7, 5, 0, 0, Math.PI * 2);
      ctx2d.ellipse(cx + 14, baseY - 385, 7, 5, 0, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.fillStyle = '#1A1412';
      ctx2d.beginPath();
      ctx2d.arc(cx - 14, baseY - 385, 3.5, 0, Math.PI * 2);
      ctx2d.arc(cx + 14, baseY - 385, 3.5, 0, Math.PI * 2);
      ctx2d.fill();

      // Cap / Headwear
      if (state.activeGarments.headwear !== 'none') {
        ctx2d.fillStyle = state.colors.headwear;
        ctx2d.beginPath();
        ctx2d.ellipse(cx, baseY - 415, 42, 22, 0, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.fillRect(cx - 35, baseY - 418, 70, 10);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
