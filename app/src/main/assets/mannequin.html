<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Atelier 3D Digital Fashion Fitting Room</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #studio-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: #FAFAFA;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #D4AF37;
      box-shadow: 0 0 6px #D4AF37;
    }
    #status-indicator {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #D4AF37;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-align: center;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
    }
    body.light-mode {
      background-color: #FAFAFA !important;
    }
    body.light-mode .badge {
      background: rgba(17, 17, 17, 0.06);
      color: #111111;
      border-color: rgba(212, 175, 55, 0.35);
    }
    #touch-hint {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(200, 200, 200, 0.4);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
  </style>

  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container">
    <div id="studio-overlay">
      <div class="badge" id="model-badge">
        <span class="badge-dot"></span>
        <span id="model-label">MALE • SLIM</span>
      </div>
    </div>
    <div id="status-indicator">Loading Model...</div>
    <div id="touch-hint">
      <span>⟵ Drag to rotate 360° ⟶</span>
    </div>
  </div>

  <script>
    const state = {
      gender: 'male',
      bodyType: 'slim',
      rotation: 0,
      isDark: true,
      skinTone: '#EEDBC8',
      colors: {
        top: '#111111',
        bottom: '#1B263B',
        shoes: '#F5F5F0',
        headwear: '#111111',
        accessories: '#D4AF37'
      }
    };

    let scene, camera, renderer, currentModelGroup, stageGroup;
    let isDragging = false;
    let previousTouchX = 0;
    let touchVelocity = 0;

    const materialsByCategory = {
      skin: [],
      top: [],
      bottom: [],
      shoes: [],
      hair: [],
      general: []
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(state.isDark ? 0x111111 : 0xFAFAFA);

      // PULL BACK & ELEVATE: 48° FOV, camera pulled to z=4.6 to fit head-to-toe with room above hair
      camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 100);
      camera.position.set(0, 1.05, 4.4);
      camera.lookAt(0, 0.85, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      setupLighting();
      buildStage();
      bindPointerEvents(renderer.domElement);

      loadGLBModel(state.gender);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function setupLighting() {
      const ambient = new THREE.AmbientLight(0xFFFFFF, 0.75);
      scene.add(ambient);

      // Key Soft Front-Right Light
      const keyLight = new THREE.DirectionalLight(0xFFFBF0, 1.2);
      keyLight.position.set(2.0, 3.2, 2.8);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      scene.add(keyLight);

      // Fill Light
      const fillLight = new THREE.DirectionalLight(0xEDF2F7, 0.55);
      fillLight.position.set(-2.2, 2.0, 2.2);
      scene.add(fillLight);

      // Warm Golden Rim Light
      const goldRim = new THREE.DirectionalLight(0xD4AF37, 1.4);
      goldRim.position.set(2.4, 2.6, -2.4);
      scene.add(goldRim);

      // Cool Secondary Rim Light
      const blueRim = new THREE.DirectionalLight(0x64B5F6, 0.8);
      blueRim.position.set(-2.4, 2.0, -2.4);
      scene.add(blueRim);
    }

    function buildStage() {
      stageGroup = new THREE.Group();

      const pedestal = new THREE.Mesh(
        new THREE.CylinderGeometry(0.85, 0.9, 0.06, 48),
        new THREE.MeshStandardMaterial({
          color: state.isDark ? 0x1A1A1A : 0xFFFFFF,
          roughness: 0.35,
          metalness: 0.1
        })
      );
      pedestal.position.y = 0.03;
      pedestal.receiveShadow = true;
      stageGroup.add(pedestal);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.87, 0.012, 16, 48),
        new THREE.MeshStandardMaterial({
          color: 0xD4AF37,
          roughness: 0.25,
          metalness: 0.85
        })
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.06;
      stageGroup.add(rim);

      scene.add(stageGroup);
    }

    // ==========================================
    // MODEL LOADING & MATERIAL MAPPING
    // ==========================================
    function loadGLBModel(gender) {
      const statusEl = document.getElementById('status-indicator');
      if (statusEl) {
        statusEl.innerText = 'Loading Model...';
        statusEl.style.opacity = '1';
      }

      const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const fileName = basePath + ((gender === 'male') ? 'models/mannequin_male.glb' : 'models/mannequin_female.glb');

      const loader = new THREE.GLTFLoader();

      loader.load(
        fileName,
        function (gltf) {
          try {
            if (currentModelGroup) scene.remove(currentModelGroup);

            for (let cat in materialsByCategory) {
              materialsByCategory[cat] = [];
            }

            currentModelGroup = gltf.scene;

            // Traverse meshes and catalog materials
            currentModelGroup.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;

                if (child.material) {
                  if (Array.isArray(child.material)) {
                    child.material = child.material.map(m => prepMaterial(m, child.name));
                  } else {
                    child.material = prepMaterial(child.material, child.name);
                  }
                }
              }
            });

            // Auto-scale to 1.50m (fits head and shoes comfortably in screen)
            currentModelGroup.scale.set(1, 1, 1);
            currentModelGroup.position.set(0, 0, 0);
            currentModelGroup.updateMatrixWorld(true);

            const box = new THREE.Box3().setFromObject(currentModelGroup);
            const size = box.getSize(new THREE.Vector3());
            const rawHeight = size.y > 0 ? size.y : 180;

            let scaleFactor = 1.50 / rawHeight;
            if (rawHeight > 20) {
              scaleFactor = 1.50 / rawHeight;
            }

            currentModelGroup.scale.setScalar(scaleFactor);
            currentModelGroup.updateMatrixWorld(true);

            const finalBox = new THREE.Box3().setFromObject(currentModelGroup);
            const finalCenter = finalBox.getCenter(new THREE.Vector3());

            currentModelGroup.position.x = -finalCenter.x;
            currentModelGroup.position.z = -finalCenter.z;
            currentModelGroup.position.y = -finalBox.min.y + 0.06;

            currentModelGroup.rotation.y = state.rotation;
            scene.add(currentModelGroup);

            reapplyAllColors();

            if (statusEl) statusEl.style.opacity = '0';
            updateBadge();
          } catch (err) {
            console.error("Error setting up model:", err);
            if (statusEl) statusEl.innerText = "Setup Error";
          }
        },
        undefined,
        function (err) {
          console.error("GLTF load failed:", err);
          const statusEl = document.getElementById('status-indicator');
          if (statusEl) statusEl.innerText = 'Model Load Failed';
        }
      );
    }

    function prepMaterial(origMat, meshName) {
      const mat = origMat.clone();
      const identifier = ((mat.name || '') + ' ' + (meshName || '')).toLowerCase();

      // Store base texture copy for non-destructive color overlays
      if (mat.map) {
        mat.userData.originalMap = mat.map;
      }
      mat.userData.originalColor = mat.color.clone();

      if (identifier.includes('skin') || identifier.includes('body') || identifier.includes('head') || identifier.includes('face') || identifier.includes('arm') || identifier.includes('leg')) {
        materialsByCategory.skin.push(mat);
      } else if (identifier.includes('top') || identifier.includes('shirt') || identifier.includes('hoodie') || identifier.includes('sweat') || identifier.includes('jacket') || identifier.includes('torso')) {
        materialsByCategory.top.push(mat);
      } else if (identifier.includes('bottom') || identifier.includes('pant') || identifier.includes('short') || identifier.includes('jean') || identifier.includes('skirt') || identifier.includes('trouser')) {
        materialsByCategory.bottom.push(mat);
      } else if (identifier.includes('shoe') || identifier.includes('sneaker') || identifier.includes('foot') || identifier.includes('boot')) {
        materialsByCategory.shoes.push(mat);
      } else if (identifier.includes('hair')) {
        materialsByCategory.hair.push(mat);
      } else {
        materialsByCategory.general.push(mat);
      }

      return mat;
    }

    // ==========================================
    // REALISTIC TINTING & FABRIC RECOLORING
    // ==========================================
    function reapplyAllColors() {
      if (state.colors.top) applyGarmentColor('top', state.colors.top);
      if (state.colors.bottom) applyGarmentColor('bottom', state.colors.bottom);
      if (state.colors.shoes) applyGarmentColor('shoes', state.colors.shoes);
      if (state.skinTone) applySkinToneReal(state.skinTone);
    }

    // Garment tinting: multiply white/grey textures or tint base color
    function applyGarmentColor(category, hex) {
      const mats = materialsByCategory[category];
      if (!mats || mats.length === 0) return;

      const targetCol = new THREE.Color(hex);

      mats.forEach(mat => {
        // If mesh has a texture map, blend color into it without obliterating folds/wrinkles
        if (mat.map) {
          mat.color.copy(targetCol);
        } else {
          mat.color.copy(targetCol);
          mat.roughness = 0.55;
          mat.metalness = 0.05;
        }
        mat.needsUpdate = true;
      });
    }

    // Realistic Skin Tone: subtle warmth overlay to preserve facial features, shadows, and lips
    function applySkinToneReal(hex) {
      const mats = materialsByCategory.skin;
      if (!mats || mats.length === 0) return;

      const targetCol = new THREE.Color(hex);

      mats.forEach(mat => {
        if (mat.map) {
          // Soft-blend multiplier: retain original photographic texture details
          // Mix base white with target tone so facial texture isn't painted flat
          mat.color.copy(targetCol).lerp(new THREE.Color(0xFFFFFF), 0.35);
          mat.roughness = 0.5;
          mat.metalness = 0.0;
        } else {
          mat.color.copy(targetCol);
          mat.roughness = 0.45;
        }
        mat.needsUpdate = true;
      });
    }

    // ==========================================
    // EXPOSED HOOKS (Triggered from Kotlin)
    // ==========================================
    window.setGender = function(gender) {
      if (!gender || gender.toLowerCase() === state.gender) return;
      state.gender = gender.toLowerCase();
      loadGLBModel(state.gender);
    };

    window.setBodyType = function(type) {
      if (!type) return;
      state.bodyType = type.toLowerCase();
      updateBadge();

      if (currentModelGroup) {
        const widthMult = (state.bodyType === 'athletic') ? 1.08 :
                          (state.bodyType === 'broad') ? 1.15 :
                          (state.bodyType === 'curvy') ? 1.12 :
                          (state.bodyType === 'slim') ? 0.94 : 1.0;
        currentModelGroup.scale.x = currentModelGroup.scale.y * widthMult;
        currentModelGroup.scale.z = currentModelGroup.scale.y * widthMult;
      }
    };

    window.setGarmentColor = function(category, hex) {
      if (!category || !hex) return;
      const cat = category.toLowerCase();
      state.colors[cat] = hex;
      applyGarmentColor(cat, hex);
    };

    window.setSkinTone = function(hex) {
      if (!hex) return;
      state.skinTone = hex;
      applySkinToneReal(hex);
    };

    window.updateColors = function(topHex, botHex, shoeHex, headHex, accHex, skinHex) {
      if (topHex) { state.colors.top = topHex; applyGarmentColor('top', topHex); }
      if (botHex) { state.colors.bottom = botHex; applyGarmentColor('bottom', botHex); }
      if (shoeHex) { state.colors.shoes = shoeHex; applyGarmentColor('shoes', shoeHex); }
      if (skinHex) { state.skinTone = skinHex; applySkinToneReal(skinHex); }
    };

    window.setRotation = function(degrees) {
      state.rotation = (degrees * Math.PI) / 180;
      if (currentModelGroup) currentModelGroup.rotation.y = state.rotation;
    };

    window.setTheme = function(isDark) {
      state.isDark = isDark;
      if (isDark) {
        document.body.classList.remove('light-mode');
        if (scene) scene.background = new THREE.Color(0x111111);
      } else {
        document.body.classList.add('light-mode');
        if (scene) scene.background = new THREE.Color(0xFAFAFA);
      }
    };

    function updateBadge() {
      const label = document.getElementById('model-label');
      if (label) {
        label.innerText = `${state.gender.toUpperCase()} • ${state.bodyType.toUpperCase()}`;
      }
    }

    // ==========================================
    // TOUCH EVENTS & ANIMATION LOOP
    // ==========================================
    function bindPointerEvents(element) {
      element.addEventListener('pointerdown', (e) => {
        isDragging = true;
        previousTouchX = e.clientX;
        touchVelocity = 0;
        const hint = document.getElementById('touch-hint');
        if (hint) hint.style.opacity = '0';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousTouchX;
        previousTouchX = e.clientX;
        touchVelocity = deltaX * 0.008;
        state.rotation += touchVelocity;
        if (currentModelGroup) currentModelGroup.rotation.y = state.rotation;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      if (!container || !renderer || !camera) return;
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging && Math.abs(touchVelocity) > 0.0001) {
        touchVelocity *= 0.92;
        state.rotation += touchVelocity;
        if (currentModelGroup) currentModelGroup.rotation.y = state.rotation;
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
