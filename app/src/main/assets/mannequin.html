<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Atelier 3D Dressing Room</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #studio-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: #FAFAFA;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #D4AF37;
      box-shadow: 0 0 6px #D4AF37;
    }
    #status-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(212, 175, 55, 0.9);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    body.light-mode {
      background-color: #FAFAFA !important;
    }
    body.light-mode .badge {
      background: rgba(17, 17, 17, 0.06);
      color: #111111;
      border-color: rgba(212, 175, 55, 0.35);
    }
    #touch-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(200, 200, 200, 0.5);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
    body.light-mode #touch-hint {
      color: rgba(120, 120, 120, 0.7);
    }
  </style>

  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container">
    <div id="studio-overlay">
      <div class="badge" id="model-badge">
        <span class="badge-dot"></span>
        <span id="model-label">FEMALE • REGULAR</span>
      </div>
    </div>
    <div id="status-indicator">Loading Model...</div>
    <div id="touch-hint">
      <span>⟵ Drag to rotate 360° ⟶</span>
    </div>
  </div>

  <script>
    const state = {
      gender: 'female',
      bodyType: 'regular',
      rotation: 0,
      isDark: true,
      skinTone: null,
      colors: {
        top: null,
        bottom: null,
        shoes: null,
        headwear: null,
        accessories: null
      }
    };

    let scene, camera, renderer, currentModelGroup, stageGroup;
    let isDragging = false;
    let previousTouchX = 0;
    let touchVelocity = 0;

    // Track mesh materials by inferred category
    const categorizedMaterials = {
      skin: [],
      top: [],
      bottom: [],
      shoes: [],
      hair: [],
      general: []
    };

    function init() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(state.isDark ? 0x111111 : 0xFAFAFA);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(0, 0.95, 3.2);
      camera.lookAt(0, 0.75, 0);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      setupLighting();
      buildStage();
      bindPointerEvents(renderer.domElement);

      // Load initial model (Female by default)
      loadGLBModel(state.gender);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function setupLighting() {
      const ambient = new THREE.AmbientLight(0xFFFFFF, 0.85);
      scene.add(ambient);

      // Key Soft Front-Right Light
      const keyLight = new THREE.DirectionalLight(0xFFFBF0, 1.1);
      keyLight.position.set(2.0, 3.2, 2.5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      scene.add(keyLight);

      // Cool Fill Light (Left)
      const fillLight = new THREE.DirectionalLight(0xEDF2F7, 0.6);
      fillLight.position.set(-2.0, 2.0, 2.0);
      scene.add(fillLight);

      // Atelier Signature Gold Rim Light (Right-Back)
      const goldRim = new THREE.DirectionalLight(0xD4AF37, 1.2);
      goldRim.position.set(2.2, 2.4, -2.2);
      scene.add(goldRim);

      // Ice-Blue Accent Rim Light (Left-Back)
      const blueRim = new THREE.DirectionalLight(0x64B5F6, 0.8);
      blueRim.position.set(-2.2, 2.0, -2.2);
      scene.add(blueRim);
    }

    function buildStage() {
      stageGroup = new THREE.Group();

      // Circular Podium
      const pedestal = new THREE.Mesh(
        new THREE.CylinderGeometry(0.85, 0.9, 0.06, 48),
        new THREE.MeshStandardMaterial({
          color: state.isDark ? 0x1A1A1A : 0xFFFFFF,
          roughness: 0.35,
          metalness: 0.1
        })
      );
      pedestal.position.y = 0.03;
      pedestal.receiveShadow = true;
      stageGroup.add(pedestal);

      // Gold Trim Ring
      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.87, 0.012, 16, 48),
        new THREE.MeshStandardMaterial({
          color: 0xD4AF37,
          roughness: 0.25,
          metalness: 0.85
        })
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.06;
      stageGroup.add(rim);

      scene.add(stageGroup);
    }

    // ==========================================
    // GLTF / GLB MODEL LOADER
    // ==========================================
    function loadGLBModel(gender) {
      const statusEl = document.getElementById('status-indicator');
      if (statusEl) {
        statusEl.innerText = 'Loading Model...';
        statusEl.style.opacity = '1';
      }

      const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
const fileName = basePath + ((gender === 'male') ? 'models/mannequin_male.glb' : 'models/mannequin_female.glb');
      const loader = new THREE.GLTFLoader();

      loader.load(
        fileName,
        function (gltf) {
          if (currentModelGroup) scene.remove(currentModelGroup);

          // Reset categorizations
          for (let key in categorizedMaterials) {
            categorizedMaterials[key] = [];
          }

          currentModelGroup = gltf.scene;

// 1. Force bone matrices to calculate accurately
currentModelGroup.traverse((child) => {
  if (child.isSkinnedMesh) {
    child.computeBoundingBox();
  }
});
currentModelGroup.updateMatrixWorld(true);

// 2. Measure actual geometric bounds
let box = new THREE.Box3();
currentModelGroup.traverse((child) => {
  if (child.isMesh) {
    if (child.geometry) {
      if (!child.geometry.boundingBox) child.geometry.computeBoundingBox();
      const geomBox = child.geometry.boundingBox.clone();
      geomBox.applyMatrix4(child.matrixWorld);
      box.union(geomBox);
    }
  }
});

// Fallback if geometry traversal yields zero
if (box.isEmpty()) {
  box.setFromObject(currentModelGroup);
}

const size = box.getSize(new THREE.Vector3());

// 3. Fallback: If raw height is around 160-190 (centimeters), divide by 100
let rawHeight = size.y;
let targetHeight = 1.35; // Ideal height inside mobile viewport

let scaleFactor = 0.009; // Sensible default for ~170cm Mixamo models
if (rawHeight > 20) {
  scaleFactor = targetHeight / rawHeight;
} else if (rawHeight > 0.1) {
  scaleFactor = targetHeight / rawHeight;
}

currentModelGroup.scale.setScalar(scaleFactor);
currentModelGroup.updateMatrixWorld(true);

// 4. Center horizontally and place feet directly on the podium
const updatedBox = new THREE.Box3().setFromObject(currentModelGroup);
const center = updatedBox.getCenter(new THREE.Vector3());

currentModelGroup.position.x = -center.x;
currentModelGroup.position.z = -center.z;
currentModelGroup.position.y = -updatedBox.min.y + 0.06;
          // Traverse meshes and map materials
          currentModelGroup.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              if (child.material) {
                // Clone material so recoloring doesn't cause texture conflicts
                if (Array.isArray(child.material)) {
                  child.material = child.material.map(m => m.clone());
                  child.material.forEach(m => categorizeMaterial(m, child.name));
                } else {
                  child.material = child.material.clone();
                  categorizeMaterial(child.material, child.name);
                }
              }
            }
          });

          // Re-apply any currently selected custom colors
          reapplyColors();

          currentModelGroup.rotation.y = state.rotation;
          scene.add(currentModelGroup);

          if (statusEl) statusEl.style.opacity = '0';
          updateBadge();
        },
        undefined,
        function (error) {
          console.error('Error loading GLB asset:', error);
          if (statusEl) statusEl.innerText = 'Model Load Failed';
        }
      );
    }

    // Heuristically map materials by mesh or material name
    function categorizeMaterial(mat, meshName) {
      const name = ((mat.name || '') + ' ' + (meshName || '')).toLowerCase();

      if (name.includes('skin') || name.includes('body') || name.includes('face') || name.includes('head')) {
        categorizedMaterials.skin.push(mat);
      } else if (name.includes('top') || name.includes('shirt') || name.includes('sweat') || name.includes('hoodie')) {
        categorizedMaterials.top.push(mat);
      } else if (name.includes('bottom') || name.includes('pant') || name.includes('short') || name.includes('jean')) {
        categorizedMaterials.bottom.push(mat);
      } else if (name.includes('shoe') || name.includes('sneaker') || name.includes('foot')) {
        categorizedMaterials.shoes.push(mat);
      } else if (name.includes('hair')) {
        categorizedMaterials.hair.push(mat);
      } else {
        categorizedMaterials.general.push(mat);
      }
    }

    function reapplyColors() {
      if (state.skinTone) applyColorToCategory('skin', state.skinTone);
      if (state.colors.top) applyColorToCategory('top', state.colors.top);
      if (state.colors.bottom) applyColorToCategory('bottom', state.colors.bottom);
      if (state.colors.shoes) applyColorToCategory('shoes', state.colors.shoes);
    }

    function applyColorToCategory(category, hex) {
      const list = categorizedMaterials[category];
      if (!list || list.length === 0) return;

      const col = new THREE.Color(hex);
      list.forEach(mat => {
        mat.color.copy(col);
        mat.needsUpdate = true;
      });
    }

    // ==========================================
    // EXPOSED HOOKS (Triggered from Compose/Kotlin)
    // ==========================================
    window.setGender = function(gender) {
      if (!gender || gender.toLowerCase() === state.gender) return;
      state.gender = gender.toLowerCase();
      loadGLBModel(state.gender);
    };

    window.setBodyType = function(type) {
      if (!type) return;
      state.bodyType = type.toLowerCase();
      updateBadge();

      if (currentModelGroup) {
        // Subtle proportion adjustment
        const widthMult = (state.bodyType === 'athletic') ? 1.08 :
                          (state.bodyType === 'broad') ? 1.15 :
                          (state.bodyType === 'slim') ? 0.94 : 1.0;
        currentModelGroup.scale.x = currentModelGroup.scale.y * widthMult;
        currentModelGroup.scale.z = currentModelGroup.scale.y * widthMult;
      }
    };

    window.setGarmentColor = function(category, hex) {
      if (!category || !hex) return;
      const cat = category.toLowerCase();
      state.colors[cat] = hex;
      applyColorToCategory(cat, hex);
    };

    window.setSkinTone = function(hex) {
      if (!hex) return;
      state.skinTone = hex;
      applyColorToCategory('skin', hex);
    };

    window.updateColors = function(topHex, bottomHex, shoesHex, headHex, accHex, skinHex) {
      if (topHex) { state.colors.top = topHex; applyColorToCategory('top', topHex); }
      if (bottomHex) { state.colors.bottom = bottomHex; applyColorToCategory('bottom', bottomHex); }
      if (shoesHex) { state.colors.shoes = shoesHex; applyColorToCategory('shoes', shoesHex); }
      if (skinHex) { state.skinTone = skinHex; applyColorToCategory('skin', skinHex); }
    };

    window.setRotation = function(degrees) {
      state.rotation = (degrees * Math.PI) / 180;
      if (currentModelGroup) currentModelGroup.rotation.y = state.rotation;
    };

    window.setTheme = function(isDark) {
      state.isDark = isDark;
      if (isDark) {
        document.body.classList.remove('light-mode');
        if (scene) scene.background = new THREE.Color(0x111111);
      } else {
        document.body.classList.add('light-mode');
        if (scene) scene.background = new THREE.Color(0xFAFAFA);
      }
    };

    function updateBadge() {
      const label = document.getElementById('model-label');
      if (label) {
        label.innerText = `${state.gender.toUpperCase()} • ${state.bodyType.toUpperCase()}`;
      }
    }

    // ==========================================
    // TOUCH INTERACTIONS & ANIMATION LOOP
    // ==========================================
    function bindPointerEvents(element) {
      element.addEventListener('pointerdown', (e) => {
        isDragging = true;
        previousTouchX = e.clientX;
        touchVelocity = 0;
        const hint = document.getElementById('touch-hint');
        if (hint) hint.style.opacity = '0';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousTouchX;
        previousTouchX = e.clientX;
        touchVelocity = deltaX * 0.008;
        state.rotation += touchVelocity;
        if (currentModelGroup) currentModelGroup.rotation.y = state.rotation;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      if (!container || !renderer || !camera) return;
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Inertia damping
      if (!isDragging && Math.abs(touchVelocity) > 0.0001) {
        touchVelocity *= 0.92;
        state.rotation += touchVelocity;
        if (currentModelGroup) currentModelGroup.rotation.y = state.rotation;
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
